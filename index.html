<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Adonis Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple: #a855f7;
  --purple-light: #c084fc;
  --purple-dim: #6b21a8;
  --purple-bg: #1e0a3c;
  --green: #34d399;
  --amber: #fbbf24;
  --red: #f87171;
  --red-bg: #1f0a0a;
  --bg: #080808;
  --bg2: #0f0f0f;
  --bg3: #141414;
  --bg4: #1a1a1a;
  --border: #222222;
  --border2: #2e2e2e;
  --text: #f0f0f0;
  --text2: #999999;
  --text3: #555555;
  --text4: #333333;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 28px 24px 64px;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 5px;
  color: var(--purple);
  text-transform: uppercase;
}

.date-pill {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 1px;
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 100px;
}

/* ── HERO ── */
.hero {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px 24px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 28px;
}

.ring-wrap {
  position: relative;
  width: 120px;
  height: 120px;
  flex-shrink: 0;
}

.ring-wrap svg {
  transform: rotate(-90deg);
  width: 120px;
  height: 120px;
}

.ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
.ring-fill { fill: none; stroke: var(--purple); stroke-width: 10; stroke-linecap: round; }

.ring-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}

.ring-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 34px;
  color: var(--purple-light);
  line-height: 1;
  letter-spacing: 2px;
}

.ring-lbl {
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 2px;
}

.hero-info { flex: 1; min-width: 0; }

.rank-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--purple-light);
  background: var(--purple-bg);
  border: 1px solid var(--purple-dim);
  padding: 4px 12px;
  border-radius: 100px;
  margin-bottom: 10px;
}

.rank-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 3px;
  color: var(--text);
  line-height: 1;
  margin-bottom: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rank-next {
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 10px;
  font-weight: 300;
}

.rank-next strong { color: var(--purple-light); font-weight: 500; }

.prog-bar {
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
}

.prog-fill {
  height: 100%;
  background: var(--purple);
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.week-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text4);
  letter-spacing: 1px;
}

/* ── RANK LADDER ── */
.rank-ladder {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 16px;
}

.ladder-title {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 16px;
}

.ladder-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.ladder-item:last-child { border-bottom: none; }

.ladder-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text4);
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
}

.ladder-item.achieved .ladder-dot { background: var(--purple); border-color: var(--purple); }
.ladder-item.current .ladder-dot { background: var(--purple-light); border-color: var(--purple-light); box-shadow: 0 0 8px var(--purple); }

.ladder-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 2px;
  color: var(--text4);
  flex: 1;
}

.ladder-item.achieved .ladder-name { color: var(--text2); }
.ladder-item.current .ladder-name { color: var(--purple-light); }

.ladder-pts {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text4);
}

.ladder-item.achieved .ladder-pts { color: var(--purple-dim); }
.ladder-item.current .ladder-pts { color: var(--purple); }

.ladder-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 100px;
  text-transform: uppercase;
}

.badge-done { background: #1a0f2e; color: var(--purple-dim); border: 1px solid var(--purple-dim); }
.badge-current { background: var(--purple-bg); color: var(--purple-light); border: 1px solid var(--purple); }
.badge-locked { background: var(--bg3); color: var(--text4); border: 1px solid var(--border); }

/* ── STATS ── */
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 14px;
  text-align: center;
}

.stat-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 2px;
  line-height: 1;
  margin-bottom: 6px;
}

.stat-num.g { color: var(--green); }
.stat-num.p { color: var(--purple); }
.stat-num.a { color: var(--amber); }

.stat-lbl {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 300;
}

/* ── SECTION HEADER ── */
.sec-hd {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text3);
  margin: 28px 0 12px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.sec-hd::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── VIRTUES ── */
.virtue-list { display: flex; flex-direction: column; gap: 8px; }

.v-item {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.v-item:hover { border-color: var(--border2); background: var(--bg3); }
.v-item.done { border-color: rgba(168, 85, 247, 0.3); }

.v-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: transparent;
  transition: all 0.2s;
}

.v-item.done .v-dot { background: var(--purple); border-color: var(--purple); color: #fff; }

.v-text {
  flex: 1;
  font-size: 14px;
  color: var(--text2);
  font-weight: 300;
  line-height: 1.3;
}

.v-item.done .v-text { color: var(--text4); text-decoration: line-through; }

.v-pts {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: var(--purple);
  flex-shrink: 0;
}

/* ── DAY TABS ── */
.day-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.dtab {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 100px;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--text3);
  background: var(--bg2);
  letter-spacing: 1px;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.dtab:hover { border-color: var(--border2); color: var(--text2); }
.dtab.active { background: var(--purple); border-color: var(--purple); color: #fff; }
.dtab.today-mark { border-color: var(--purple-dim); }

/* ── EXERCISE CARD ── */
.ex-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.ex-title-bar {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text3);
}

.ex-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.ex-item:last-child { border-bottom: none; }
.ex-item:hover { background: var(--bg3); }
.ex-item.xdone { background: var(--bg); }

.ex-box {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: transparent;
  transition: all 0.15s;
}

.ex-item.xdone .ex-box { background: var(--purple); border-color: var(--purple); color: #fff; }

.ex-name {
  flex: 1;
  font-size: 13px;
  color: var(--text2);
  font-weight: 300;
}

.ex-item.xdone .ex-name { color: var(--text4); text-decoration: line-through; }

.ex-set {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text3);
  flex-shrink: 0;
}

.ex-note {
  font-size: 11px;
  color: rgba(168, 85, 247, 0.4);
  font-style: italic;
  padding: 10px 18px;
  border-top: 1px solid var(--border);
  text-align: center;
  letter-spacing: 0.5px;
}

/* ── SINS ── */
.sin-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.sin-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.sin-item:hover { border-color: rgba(248, 113, 113, 0.3); }
.sin-item.sinned { border-color: rgba(248, 113, 113, 0.35); background: var(--red-bg); }

.sin-name {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 5px;
  font-weight: 300;
}

.sin-item.sinned .sin-name { color: var(--red); }

.sin-pts {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: var(--red);
}

/* ── HISTORY ── */
.hist-grid {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.hday {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--bg2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text4);
  font-weight: 400;
}

.hday.s { background: var(--purple); border-color: var(--purple); color: #fff; }
.hday.m { background: #3b1060; border-color: var(--purple-dim); color: var(--purple-light); }
.hday.w { background: #120920; border-color: #1e0f30; color: var(--text4); }

/* ── ACTIONS ── */
.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 28px;
}

.act-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text3);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  padding: 13px 10px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.15s;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}

.act-btn:hover { border-color: var(--purple); color: var(--purple); }
.act-btn.danger:hover { border-color: var(--red); color: var(--red); }

/* ── IMPORT ── */
.import-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  margin-top: 10px;
  display: none;
  flex-direction: column;
  gap: 12px;
}

.import-wrap.open { display: flex; }

.import-wrap textarea {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 12px;
  width: 100%;
  height: 100px;
  resize: none;
  outline: none;
  line-height: 1.5;
}

.import-wrap textarea::placeholder { color: var(--text4); }
.import-wrap textarea:focus { border-color: var(--purple); }

.import-btns { display: flex; gap: 8px; }

.imp-confirm {
  background: var(--purple);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  padding: 11px 20px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.imp-cancel {
  background: none;
  border: 1px solid var(--border2);
  border-radius: 10px;
  color: var(--text3);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  padding: 11px 20px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.15s;
}

.imp-cancel:hover { border-color: var(--red); color: var(--red); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg3);
  border: 1px solid var(--purple);
  color: var(--purple-light);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  padding: 11px 24px;
  border-radius: 100px;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
  letter-spacing: 1px;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.neg { border-color: var(--red); color: var(--red); }

/* ── FOOTER ── */
.footer {
  text-align: center;
  margin-top: 40px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text4);
  letter-spacing: 2px;
}

/* ── MOBILE ── */
@media (max-width: 480px) {
  .app { padding: 20px 16px 60px; }
  .hero { padding: 20px 18px; gap: 20px; }
  .ring-wrap { width: 100px; height: 100px; }
  .ring-wrap svg { width: 100px; height: 100px; }
  .ring-num { font-size: 28px; }
  .rank-name { font-size: 28px; }
  .stat-num { font-size: 26px; }
}
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="logo">Adonis Protocol</div>
    <div class="date-pill" id="date-str">—</div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <circle class="ring-bg" cx="60" cy="60" r="50"/>
        <circle class="ring-fill" cx="60" cy="60" r="50"
          stroke-dasharray="314"
          id="ring-dash"
          stroke-dashoffset="314"/>
      </svg>
      <div class="ring-center">
        <div class="ring-num" id="ring-num">0</div>
        <div class="ring-lbl">Aura</div>
      </div>
    </div>
    <div class="hero-info">
      <div class="rank-chip" id="rank-chip">Rank I</div>
      <div class="rank-name" id="rank-name">Joffrey</div>
      <div class="rank-next" id="rank-next">— to <strong>Apprentice</strong></div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="week-lbl" id="week-lbl">Week 1 · Day 1</div>
    </div>
  </div>

  <!-- RANK LADDER -->
  <div class="rank-ladder">
    <div class="ladder-title">Ascension path</div>
    <div id="ladder-list"></div>
  </div>

  <!-- STATS -->
  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-num g" id="streak-n">0</div>
      <div class="stat-lbl">Streak</div>
    </div>
    <div class="stat-card">
      <div class="stat-num p" id="week-n">0</div>
      <div class="stat-lbl">This week</div>
    </div>
    <div class="stat-card">
      <div class="stat-num a" id="best-n">0</div>
      <div class="stat-lbl">Best streak</div>
    </div>
  </div>

  <!-- VIRTUES -->
  <div class="sec-hd">Daily virtues</div>
  <div class="virtue-list" id="virtue-list"></div>

  <!-- TRAINING -->
  <div class="sec-hd">Training</div>
  <div class="day-tabs" id="day-tabs"></div>
  <div class="ex-card" id="ex-card"></div>

  <!-- SINS -->
  <div class="sec-hd">Sins</div>
  <div class="sin-grid" id="sin-grid"></div>

  <!-- HISTORY -->
  <div class="sec-hd">30-day chronicle</div>
  <div class="hist-grid" id="hist-grid"></div>

  <!-- ACTIONS -->
  <div class="action-row">
    <button class="act-btn" onclick="exportData()">Export</button>
    <button class="act-btn" onclick="toggleImport()">Import</button>
    <button class="act-btn danger" onclick="resetDay()">Reset day</button>
  </div>

  <div class="import-wrap" id="import-wrap">
    <textarea id="import-txt" placeholder="Paste your exported JSON backup here..."></textarea>
    <div class="import-btns">
      <button class="imp-confirm" onclick="doImport()">Import</button>
      <button class="imp-cancel" onclick="toggleImport()">Cancel</button>
    </div>
  </div>

  <div class="footer">Joffrey &rarr; Adonis &nbsp;&middot;&nbsp; Stay consistent</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SK = 'adonis_v4';

const RANKS = [
  { n: 'Joffrey',      sub: 'The Unworthy',         min: 0,    max: 75   },
  { n: 'Apprentice',   sub: 'First steps taken',     min: 75,   max: 175  },
  { n: 'Initiate',     sub: 'The grind begins',      min: 175,  max: 325  },
  { n: 'Soldier',      sub: 'Showing up daily',      min: 325,  max: 525  },
  { n: 'Warrior',      sub: 'Pain is familiar now',  min: 525,  max: 800  },
  { n: 'Gladiator',    sub: 'Built in the fire',     min: 800,  max: 1150 },
  { n: 'Champion',     sub: 'Others notice',         min: 1150, max: 1600 },
  { n: 'Sovereign',    sub: 'Command the room',      min: 1600, max: 2200 },
  { n: 'Legend',       sub: 'Few reach this',        min: 2200, max: 3000 },
  { n: 'Adonis',       sub: 'The pinnacle',          min: 3000, max: 99999 }
];

const VIRTUES = [
  { id: 'workout', name: 'Complete workout',       pts: 30 },
  { id: 'walk',    name: 'Walkpad 30 min fasted',  pts: 25 },
  { id: 'sun',     name: '15-20 min sunlight',     pts: 20 },
  { id: 'wake',    name: 'Wake by 9AM',             pts: 15 },
  { id: 'work',    name: '3+ hours deep work',      pts: 15 },
  { id: 'study',   name: 'Study or research',       pts: 10 },
  { id: 'photo',   name: 'Body photo taken',        pts: 10 }
];

const SINS = [
  { id: 'fap',       name: 'Fapped',           pts: -40 },
  { id: 'smoke',     name: 'Smoked',           pts: -25 },
  { id: 'miss_w',    name: 'Missed workout',   pts: -30 },
  { id: 'miss_work', name: 'Under 3h work',    pts: -15 }
];

const WD = {
  1: { t: 'Chest + Shoulders + Abs', ex: [
    ['Incline pushups on chair','4×15'],
    ['Dumbbell chest fly (floor)','4×12'],
    ['Decline pushups (feet on chair)','3×12'],
    ['Resistance band chest press','3×15'],
    ['Dumbbell shoulder press','4×12'],
    ['Resistance band lateral raise','3×15'],
    ['Leg raises','4×15'],
    ['Bicycle crunches','3×20']
  ]},
  2: { t: 'Back + Biceps + Abs', ex: [
    ['Edge pullups','5×max'],
    ['Resistance band rows','4×15'],
    ['Dumbbell bent over row','4×12'],
    ['Resistance band face pulls','3×15'],
    ['Dumbbell curl','3×12'],
    ['Resistance band hammer curl','3×12'],
    ['Hollow body hold','3×30s'],
    ['Reverse crunches','4×15']
  ]},
  3: { t: 'Cricket — Active Recovery', ex: [
    ['Play cricket 1-2 hours','active'],
    ['Light stretching post game','10 min']
  ]},
  4: { t: 'Chest + Triceps + Abs', ex: [
    ['Wide pushups','4×15'],
    ['Resistance band chest fly','4×15'],
    ['Dumbbell floor press','4×12'],
    ['Diamond pushups','3×12'],
    ['Chair dips','4×12'],
    ['Resistance band pushdown','3×15'],
    ['Plank','3×45s'],
    ['Dead bug','3×10 each']
  ]},
  5: { t: 'Back + Legs + Shoulders', ex: [
    ['Resistance band lat pulldown','4×12'],
    ['Dumbbell bent over row','4×12'],
    ['Superman holds','3×12'],
    ['Resistance band pull apart','3×20'],
    ['Goblet squat (dumbbell)','4×15'],
    ['Reverse lunges','3×12 each'],
    ['Single leg glute bridge','3×12 each'],
    ['Resistance band upright row','3×12']
  ]},
  6: { t: 'Cricket — Active Recovery', ex: [
    ['Play cricket 1-2 hours','active'],
    ['Light stretching post game','10 min']
  ]},
  7: { t: 'Rest & Recover', ex: [
    ['Walk 20+ minutes','easy pace'],
    ['Mobility / stretching','15 min']
  ]}
};

function todayKey() { return new Date().toISOString().slice(0, 10); }

function load() {
  try { const r = localStorage.getItem(SK); if (r) return JSON.parse(r); }
  catch(e) {}
  return { totalAura: 0, bestStreak: 0, startDate: todayKey(), days: {} };
}

function save(s) { try { localStorage.setItem(SK, JSON.stringify(s)); } catch(e) {} }

function getDay(s, k) {
  if (!s.days[k]) s.days[k] = { v: {}, sins: {}, ex: {}, aura: 0 };
  return s.days[k];
}

function getRank(a) {
  for (let i = RANKS.length - 1; i >= 0; i--) if (a >= RANKS[i].min) return { ...RANKS[i], idx: i };
  return { ...RANKS[0], idx: 0 };
}

function getNext(a) {
  for (let i = 0; i < RANKS.length; i++) if (a < RANKS[i].max) return { ...RANKS[i], idx: i };
  return { ...RANKS[RANKS.length-1], idx: RANKS.length-1 };
}

function calcStreak(s) {
  let streak = 0, d = new Date();
  for (let i = 0; i < 120; i++) {
    const k = d.toISOString().slice(0, 10);
    const day = s.days[k];
    if (!day || Object.values(day.v).filter(Boolean).length < 3) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function calcWeek(s) {
  let t = 0; const d = new Date();
  for (let i = 0; i < 7; i++) {
    const k = d.toISOString().slice(0, 10);
    if (s.days[k]) t += (s.days[k].aura || 0);
    d.setDate(d.getDate() - 1);
  }
  return Math.max(0, t);
}

function recalc(s) {
  let t = 0;
  Object.values(s.days).forEach(d => { t += (d.aura || 0); });
  s.totalAura = Math.max(0, t);
}

function getTrainingDay(s) {
  const diff = Math.floor((new Date() - new Date(s.startDate)) / 86400000);
  return (diff % 7) + 1;
}

function getWeekNum(s) {
  const diff = Math.floor((new Date() - new Date(s.startDate)) / 86400000);
  return Math.floor(diff / 7) + 1;
}

let toastT = null;
function toast(msg, neg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (neg ? ' neg' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

let S = load();
let selDay = getTrainingDay(S);

function render() {
  const today = todayKey();
  const dd = getDay(S, today);
  const aura = S.totalAura;
  const rank = getRank(aura);
  const next = getNext(aura);
  const pct = rank.min === next.min ? 100
    : Math.min(100, Math.round(((aura - rank.min) / (next.max - rank.min)) * 100));
  const circumference = 314;
  const offset = Math.round(circumference * (1 - pct / 100));

  document.getElementById('date-str').textContent =
    new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });

  document.getElementById('ring-num').textContent = aura;
  document.getElementById('ring-dash').setAttribute('stroke-dashoffset', offset);

  document.getElementById('rank-chip').textContent = 'Rank ' + (rank.idx + 1);
  document.getElementById('rank-name').textContent = rank.n;
  document.getElementById('rank-next').innerHTML = aura >= 3000
    ? 'The pinnacle. Maintain it.'
    : `${next.max - aura} pts to <strong>${next.n}</strong>`;
  document.getElementById('prog-fill').style.width = pct + '%';

  const wk = Math.min(getWeekNum(S), 8);
  const td = getTrainingDay(S);
  document.getElementById('week-lbl').textContent = `Week ${wk} · Training day ${td}`;

  const streak = calcStreak(S);
  S.bestStreak = Math.max(S.bestStreak || 0, streak);
  document.getElementById('streak-n').textContent = streak;
  document.getElementById('week-n').textContent = calcWeek(S);
  document.getElementById('best-n').textContent = S.bestStreak;

  // Rank ladder
  const ladder = document.getElementById('ladder-list');
  ladder.innerHTML = '';
  RANKS.forEach((r, i) => {
    const achieved = aura >= r.max;
    const current = (i === rank.idx);
    const el = document.createElement('div');
    el.className = 'ladder-item' + (achieved ? ' achieved' : '') + (current ? ' current' : '');
    let badge = '';
    if (achieved) badge = '<span class="ladder-badge badge-done">Done</span>';
    else if (current) badge = '<span class="ladder-badge badge-current">You</span>';
    else badge = '<span class="ladder-badge badge-locked">' + r.min + '+</span>';
    el.innerHTML = `<div class="ladder-dot"></div><div class="ladder-name">${r.n}</div><div class="ladder-pts">${r.sub}</div>${badge}`;
    ladder.appendChild(el);
  });

  // Virtues
  const vl = document.getElementById('virtue-list');
  vl.innerHTML = '';
  VIRTUES.forEach(v => {
    const done = !!dd.v[v.id];
    const el = document.createElement('div');
    el.className = 'v-item' + (done ? ' done' : '');
    el.innerHTML = `<div class="v-dot">${done ? '✓' : ''}</div><div class="v-text">${v.name}</div><div class="v-pts">+${v.pts}</div>`;
    el.onclick = () => {
      if (done) { dd.v[v.id] = false; dd.aura -= v.pts; toast('−' + v.pts + ' aura', true); }
      else { dd.v[v.id] = true; dd.aura += v.pts; toast('+' + v.pts + ' aura'); }
      recalc(S); save(S); render();
    };
    vl.appendChild(el);
  });

  // Day tabs
  const tabs = document.getElementById('day-tabs');
  tabs.innerHTML = '';
  for (let d = 1; d <= 7; d++) {
    const tab = document.createElement('div');
    tab.className = 'dtab' + (d === selDay ? ' active' : '') + (d === td ? ' today-mark' : '');
    tab.textContent = 'D' + d;
    tab.title = WD[d].t;
    tab.onclick = () => { selDay = d; render(); };
    tabs.appendChild(tab);
  }

  // Exercises
  const card = document.getElementById('ex-card');
  card.innerHTML = '';
  const prog = WD[selDay];
  const titleBar = document.createElement('div');
  titleBar.className = 'ex-title-bar';
  titleBar.textContent = prog.t;
  card.appendChild(titleBar);

  prog.ex.forEach(([name, sets], i) => {
    const exId = 'd' + selDay + '_' + i;
    const done = !!dd.ex[exId];
    const el = document.createElement('div');
    el.className = 'ex-item' + (done ? ' xdone' : '');
    el.innerHTML = `<div class="ex-box">${done ? '✓' : ''}</div><div class="ex-name">${name}</div><div class="ex-set">${sets}</div>`;
    el.onclick = () => { dd.ex[exId] = !done; save(S); render(); };
    card.appendChild(el);
  });

  if (wk > 1) {
    const note = document.createElement('div');
    note.className = 'ex-note';
    note.textContent = 'Week ' + wk + ' — add 2 reps or heavier band on every set';
    card.appendChild(note);
  }

  // Sins
  const sg = document.getElementById('sin-grid');
  sg.innerHTML = '';
  SINS.forEach(sin => {
    const committed = !!dd.sins[sin.id];
    const el = document.createElement('div');
    el.className = 'sin-item' + (committed ? ' sinned' : '');
    el.innerHTML = `<div class="sin-name">${sin.name}</div><div class="sin-pts">${sin.pts}</div>`;
    el.onclick = () => {
      if (committed) { dd.sins[sin.id] = false; dd.aura -= sin.pts; toast('Sin absolved'); }
      else { dd.sins[sin.id] = true; dd.aura += sin.pts; toast(sin.pts + ' aura — weakness', true); }
      recalc(S); save(S); render();
    };
    sg.appendChild(el);
  });

  // History
  const hg = document.getElementById('hist-grid');
  hg.innerHTML = '';
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.toISOString().slice(0, 10);
    const hd = S.days[k];
    const el = document.createElement('div');
    el.className = 'hday';
    el.textContent = d.getDate();
    if (hd) {
      const c = Object.values(hd.v).filter(Boolean).length;
      if (c >= 5) el.classList.add('s');
      else if (c >= 3) el.classList.add('m');
      else el.classList.add('w');
    }
    el.title = k + (hd ? ` — ${Object.values(hd.v).filter(Boolean).length}/7 virtues` : '');
    hg.appendChild(el);
  }
}

function exportData() {
  const data = JSON.stringify(S, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'adonis_backup_' + todayKey() + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('Backup downloaded');
}

function toggleImport() {
  document.getElementById('import-wrap').classList.toggle('open');
}

function doImport() {
  const txt = document.getElementById('import-txt').value.trim();
  try {
    const parsed = JSON.parse(txt);
    if (!parsed.days) throw new Error('Invalid');
    S = parsed; recalc(S); save(S); render();
    toggleImport();
    toast('Data imported');
  } catch(e) { toast('Invalid backup — check and retry', true); }
}

function resetDay() {
  const today = todayKey();
  S.days[today] = { v: {}, sins: {}, ex: {}, aura: 0 };
  recalc(S); save(S); render();
  toast('Today reset', true);
}

render();
</script>
